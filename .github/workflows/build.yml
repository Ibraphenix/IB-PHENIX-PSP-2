name: Build IB PHENIX PSP

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compiler avec PSPDEV
        run: |
          docker pull pspdev/pspdev:latest
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            pspdev/pspdev:latest \
            sh -c 'mkdir -p build && cd build && psp-cmake .. && make -j2'

      - name: Vérifier les fichiers générés
        run: |
          echo "=== CONTENU DU PROJET ==="
          find . -maxdepth 5 -type f | sort
          echo ""
          echo "=== RECHERCHE EBOOT.PBP ==="
          find . -type f -iname "EBOOT.PBP" -print
          echo ""
          echo "=== DOSSIER BUILD ==="
          ls -lah build 2>/dev/null || true

      - name: Publier EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: IB-PHENIX-EBOOT
          path: "**/EBOOT.PBP"
          if-no-files-found: error
